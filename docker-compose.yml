version: "3.9"

services:

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: bluesea_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB:       ${POSTGRES_DB:-bluesea}
    ports:
      - "5432:5432"            # remove in production if app doesn't need external access
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bluesea}"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ─── Next.js application ───────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bluesea_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database (points to the db service above)
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bluesea}

      # Session
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env}

      # S3-compatible object storage
      S3_ENDPOINT:    ${S3_ENDPOINT:?S3_ENDPOINT must be set in .env}
      S3_REGION:      ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY:  ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env}
      S3_SECRET_KEY:  ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?S3_BUCKET_NAME must be set in .env}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
